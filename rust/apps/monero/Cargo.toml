[package]
name = "app_monero"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hex = { workspace = true }
cryptoxide = { workspace = true }
bitcoin = { workspace = true }
curve25519-dalek = { version = "4.1.3", default-features = false }
base58-monero = { version = "2", default-features = false }
rand_core = { workspace = true }
zeroize = { workspace = true }
app_utils = { path = "../utils" }
rust_tools = { path = "../../tools" }
chacha20 = { version = "0.9.1", default-features = false }
rand_chacha = { workspace = true }
thiserror = { workspace = true }
keystore = { workspace = true, default-features = false, features = ["multi_coins"] }
cuprate-cryptonight = { git = "https://github.com/KeystoneHQ/cuprate", default-features = false, features = ["no_std"] }
# Plan v11 §4.12: monero-serai → monero-oxide migration. Migration
# completed in steps 1-3 (2026-07-26). monero-serai / monero-wallet
# (KeystoneHQ/serai) replaced by the kosmoli/monero-oxide fork
# (github.com/kosmoli/monero-oxide @ 48f5e0f) which adds 7 'pub'
# keywords to expose SharedKeyDerivations + 2 fields + 6 methods that
# keystone's business logic reads directly. Upstream monero-oxide
# exposes Point::biased_hash() publicly (this is Monero's hash_to_ec);
# only SharedKeyDerivations needed exposure.
#
# We use local `path` deps (../works/monero-oxide/monero-oxide and
# ../works/monero-oxide/monero-oxide/wallet) rather than git subdirectory
# because monero-oxide is a Cargo workspace: git subdirectory only pulls
# the wallet crate, breaking sibling crate path resolution.
monero-oxide = { path = "../../../../monero-oxide/monero-oxide", default-features = false }
# monero-wallet is the keystone-needed sibling crate (keystone used to
# import `monero_wallet::SharedKeyDerivations` from the serai monorepo).
# In monero-oxide, this is its own crate `monero-wallet` (note the
# hyphen, not underscore). Same path relative to the monorepo root.
monero-wallet = { path = "../../../../monero-oxide/monero-oxide/wallet", default-features = false }

[dev-dependencies]
keystore = { workspace = true, features = ["cypherpunk"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }