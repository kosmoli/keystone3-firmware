[package]
name = "app_monero"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hex = { workspace = true }
cryptoxide = { workspace = true }
bitcoin = { workspace = true }
curve25519-dalek = { version = "4.1.3", default-features = false }
base58-monero = { version = "2", default-features = false }
rand_core = { workspace = true }
zeroize = { workspace = true }
app_utils = { path = "../utils" }
rust_tools = { path = "../../tools" }
chacha20 = { version = "0.9.1", default-features = false }
rand_chacha = { workspace = true }
thiserror = { workspace = true }
keystore = { workspace = true, default-features = false, features = ["multi_coins"] }
cuprate-cryptonight = { git = "https://github.com/KeystoneHQ/cuprate", default-features = false, features = ["no_std"] }
# Plan v11 §4.12: monero-serai → monero-oxide migration.
# monero-serai is the historical dep (KeystoneHQ/serai#c784e6c6); monero-oxide
# is the upstream migration target (monero-oxide/monero-oxide monorepo,
# top-level sub-crate paths under monero-oxide/). This commit adds
# monero-oxide as an additional dependency WITHOUT removing
# monero-serai — the use-site migration follows once we confirm
# the build pulls monero-oxide cleanly. We keep monero-wallet in
# place for the same reason; it's a separate crate name in the
# old monorepo.
monero-oxide = { git = "https://github.com/monero-oxide/monero-oxide", default-features = false }
monero-serai = { git = "https://github.com/KeystoneHQ/serai", default-features = false }
monero-wallet = { git = "https://github.com/KeystoneHQ/serai", default-features = false }

[dev-dependencies]
keystore = { workspace = true, features = ["cypherpunk"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }